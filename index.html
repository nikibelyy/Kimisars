<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЮWheel — Испытай удачу</title>
  <link rel="stylesheet" href="style.css">
  <!-- Подключение VK ID SDK -->
  <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
</head>
<body>

  <!-- Шапка сайта -->
  <header class="header">
    <div class="container header-container">
      <div class="logo">Ю<span>Wheel</span></div>
      
      <div class="user-block" id="userBlock">
        <button class="btn btn-vk" id="vkAuthBtn">Войти через VK</button>
      </div>
    </div>
  </header>

  <main class="container main-content">
    
    <!-- Панель управления балансом -->
    <section class="card balance-card">
      <div class="balance-info">
        <span class="label">Ваш баланс</span>
        <h2 id="balanceValue">0 ₽</h2>
      </div>
      <div class="balance-actions">
        <button class="btn btn-primary" onclick="openModal('depositModal')">Пополнить</button>
        <button class="btn btn-secondary" onclick="openModal('withdrawModal')">Вывести</button>
      </div>
    </section>

    <!-- Секция Игры (Колесо) -->
    <section class="card game-card">
      <h2>Колесо Фортуны</h2>
      <p class="subtitle">Чем выше ставка, тем больше шанс на победу!</p>

      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="340" height="340"></canvas>
      </div>

      <div class="bet-controls">
        <div class="input-group">
          <input type="number" id="betAmount" placeholder="Сумма ставки" min="10" value="100">
          <span class="currency">₽</span>
        </div>
        <button class="btn btn-accent" id="spinBtn">Сделать ставку</button>
      </div>

      <!-- Список участников текущего раунда -->
      <div class="players-list">
        <h3>Участники раунда</h3>
        <ul id="playersContainer">
          <!-- Динамические данные -->
        </ul>
      </div>
    </section>

  </main>

  <!-- Модальное окно пополнения -->
  <div class="modal" id="depositModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('depositModal')">&times;</span>
      <h3>Пополнение баланса</h3>
      <input type="number" id="depositAmount" placeholder="Введите сумму (₽)" min="50">
      <button class="btn btn-primary btn-full" onclick="handleDeposit()">Перейти к оплате</button>
    </div>
  </div>

  <!-- Модальное окно вывода -->
  <div class="modal" id="withdrawModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('withdrawModal')">&times;</span>
      <h3>Вывод средств</h3>
      <input type="text" id="withdrawWallet" placeholder="Номер ЮMoney кошелька или карты">
      <input type="number" id="withdrawAmount" placeholder="Сумма вывода (₽)" min="100">
      <button class="btn btn-primary btn-full" onclick="handleWithdraw()">Запросить вывод</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
