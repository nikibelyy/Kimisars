<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Настройки для идеального отображения на iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F5F6F8">
    
    <title>ДТП СЕРВИС</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Главный экран -->
    <main class="app-container">
        <header class="app-header">
            <h1>ДТП СЕРВИС</h1>
            <p>База клиентов</p>
        </header>

        <div class="client-list" id="clientList">
            <!-- Сюда будут добавляться карточки клиентов -->
            <div class="empty-state">Нет записей. Добавьте первого клиента.</div>
        </div>

        <button class="fab" id="openAddModal">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </main>

    <!-- Всплывающее окно добавления (Bottom Sheet) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="bottom-sheet" id="bottomSheet">
            <div class="sheet-header">
                <h3>Новое ДТП</h3>
                <button class="close-btn" id="closeModal">✕</button>
            </div>
            <form id="addClientForm">
                <div class="input-group">
                    <label>ФИО клиента</label>
                    <input type="text" id="clientName" placeholder="Иванов Иван Иванович" required>
                </div>
                <div class="input-group">
                    <label>Марка и госномер</label>
                    <input type="text" id="carInfo" placeholder="Toyota Camry, А123АА" required>
                </div>
                <div class="input-group">
                    <label>Телефон</label>
                    <input type="tel" id="clientPhone" placeholder="+7 (999) 000-00-00" required>
                </div>
                <button type="submit" class="btn-primary">Сохранить в базу</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
