<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Записная книга">
  <meta name="theme-color" content="#121216">
  <title>Ю-Книга</title>

  <script>
    // Динамический манифест для установки PWA на iPhone
    const manifest = {
      "name": "Ю-Записная Книга",
      "short_name": "Записи",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#121216",
      "theme_color": "#7B5CFF",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%237B5CFF'/><text x='50%' y='68%' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>Ю</text></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>

  <style>
    :root {
      --bg: #121216;
      --card: #1C1C22;
      --card-active: #262630;
      --accent: #7B5CFF;
      --accent-glow: rgba(123, 92, 255, 0.4);
      --mint: #00D692;
      --text: #FFFFFF;
      --text-sub: #8E8E93;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-top: calc(env(safe-area-inset-top) + 10px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 90px);
      overflow-x: hidden;
      user-select: none;
    }

    /* Шапка в стиле ЮMoney */
    header {
      padding: 10px 20px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFF 30%, #A0A0B0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(0, 214, 146, 0.12);
      color: var(--mint);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 8px var(--mint);
    }

    /* Верхний виджет общей суммы */
    .balance-card {
      margin: 5px 20px 20px;
      background: linear-gradient(135deg, #1C1C22 0%, #15151B 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .balance-title {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .balance-val {
      font-size: 26px;
      font-weight: 800;
      color: var(--mint);
      letter-spacing: -0.5px;
    }

    .entries-count {
      font-size: 13px;
      color: var(--text-sub);
      text-align: right;
    }

    .entries-num {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    /* Поиск */
    .search-box {
      padding: 0 20px 15px;
    }

    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Лента записей (Страницы книги) */
    .notebook-list {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s ease, background-color 0.2s ease;
      animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .note-card:active {
      transform: scale(0.98);
      background: var(--card-active);
    }

    .note-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .note-name {
      font-size: 18px;
      font-weight: 700;
      color: #FFF;
    }

    .note-date {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .note-amount {
      font-size: 18px;
      font-weight: 700;
      color: var(--mint);
    }

    .note-body {
      font-size: 15px;
      line-height: 1.4;
      color: #D0D0E0;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 12px;
      border-left: 3px solid var(--accent);
    }

    .note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-action {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-action.delete {
      color: #FF453A;
    }

    /* Кнопка Добавить (FAB) */
    .fab {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 25px);
      right: 20px;
      width: 62px;
      height: 62px;
      border-radius: 31px;
      background: linear-gradient(135deg, #7B5CFF 0%, #5A35FF 100%);
      color: white;
      border: none;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px var(--accent-glow);
      cursor: pointer;
      transition: transform 0.2s ease;
      z-index: 100;
    }

    .fab:active {
      transform: scale(0.9);
    }

    /* Шторка записи (Модалка) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: flex-end;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: 100%;
      background: var(--card);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 24px 20px calc(env(safe-area-inset-bottom) + 24px);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text-sub);
      width: 32px;
      height: 32px;
      border-radius: 16px;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    textarea.form-control {
      min-height: 90px;
      resize: none;
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 10px;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .submit-btn:active {
      opacity: 0.85;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: 15px;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="title">Записи</div>
    <div class="badge">Офлайн книжка</div>
  </header>

  <!-- Верхняя сводка -->
  <div class="balance-card">
    <div>
      <div class="balance-title">Итого зафиксировано</div>
      <div class="balance-val" id="totalSum">0 ₽</div>
    </div>
    <div class="entries-count">
      <div class="balance-title">Всего страниц</div>
      <div class="entries-num" id="totalCount">0</div>
    </div>
  </div>

  <!-- Поиск -->
  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по записям и именам...">
  </div>

  <!-- Список записей -->
  <div class="notebook-list" id="notebookList"></div>

  <!-- Кнопка добавления -->
  <button class="fab" id="openModalBtn">+</button>

  <!-- Форма записи -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Новая запись</div>
        <button class="close-btn" id="closeModalBtn">✕</button>
      </div>
      <form id="noteForm">
        <input type="hidden" id="noteId">
        <div class="form-group">
          <label>Клиент / Имя</label>
          <input type="text" id="noteName" class="form-control" placeholder="Алексей" required>
        </div>
        <div class="form-group">
          <label>Сумма (₽)</label>
          <input type="number" id="noteAmount" class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label>Заметка / Заказ / Текст</label>
          <textarea id="noteText" class="form-control" placeholder="Напиши сюда все подробности..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Записать</button>
      </form>
    </div>
  </div>

  <script>
    // Хранение данных
    let entries = JSON.parse(localStorage.getItem('my_book_entries')) || [
      {
        id: '1',
        name: 'Иван Петров',
        amount: 15000,
        text: 'Сделал предоплату за дизайн. Срок — до пятницы.',
        date: '07 авг. 2026, 14:20'
      }
    ];

    function save() {
      localStorage.setItem('my_book_entries', JSON.stringify(entries));
      render();
    }

    function render() {
      const list = document.getElementById('notebookList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      list.innerHTML = '';

      let total = 0;

      const filtered = entries.filter(item => {
        const match = item.name.toLowerCase().includes(search) || item.text.toLowerCase().includes(search);
        if (match) total += Number(item.amount || 0);
        return match;
      });

      document.getElementById('totalSum').innerText = total.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('totalCount').innerText = entries.length;

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state">Записей пока нет. Нажмите +, чтобы добавить первую!</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.innerHTML = `
          <div class="note-top">
            <div>
              <div class="note-name">${escapeHTML(item.name)}</div>
              <div class="note-date">${item.date}</div>
            </div>
            ${item.amount ? `<div class="note-amount">${Number(item.amount).toLocaleString('ru-RU')} ₽</div>` : ''}
          </div>
          ${item.text ? `<div class="note-body">${escapeHTML(item.text)}</div>` : ''}
          <div class="note-actions">
            <button class="btn-action" onclick="editNote('${item.id}')">Редактировать</button>
            <button class="btn-action delete" onclick="deleteNote('${item.id}')">Удалить</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    // Модальное окно
    const modalOverlay = document.getElementById('modalOverlay');
    const noteForm = document.getElementById('noteForm');

    function openModal() { modalOverlay.classList.add('active'); }
    function closeModal() {
      modalOverlay.classList.remove('active');
      noteForm.reset();
      document.getElementById('noteId').value = '';
      document.getElementById('modalTitle').innerText = 'Новая запись';
    }

    document.getElementById('openModalBtn').addEventListener('click', openModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);

    noteForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('noteId').value;
      const name = document.getElementById('noteName').value;
      const amount = document.getElementById('noteAmount').value;
      const text = document.getElementById('noteText').value;

      if (id) {
        const item = entries.find(x => x.id === id);
        if (item) {
          item.name = name;
          item.amount = amount;
          item.text = text;
        }
      } else {
        const now = new Date();
        const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' }) + ', ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        entries.unshift({
          id: Date.now().toString(),
          name,
          amount,
          text,
          date: dateStr
        });
      }

      save();
      closeModal();
    });

    window.editNote = function(id) {
      const item = entries.find(x => x.id === id);
      if (!item) return;
      document.getElementById('noteId').value = item.id;
      document.getElementById('noteName').value = item.name;
      document.getElementById('noteAmount').value = item.amount || '';
      document.getElementById('noteText').value = item.text || '';
      document.getElementById('modalTitle').innerText = 'Редактировать запись';
      openModal();
    };

    window.deleteNote = function(id) {
      if (confirm('Удалить эту запись?')) {
        entries = entries.filter(x => x.id !== id);
        save();
      }
    };

    document.getElementById('searchInput').addEventListener('input', render);

    // Поддержка работы без интернета (Service Worker)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(caches.open('book-v1').then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }

    render();
  </script>
</body>
</html>
