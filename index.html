<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мой график">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Мой график</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">РАБОЧИЙ РИТМ</div>
        <h1 id="monthTitle"></h1>
      </div>
      <button class="glass icon-btn" id="todayBtn" aria-label="Сегодня">●</button>
    </header>

    <main id="screens">
      <section class="screen active" id="calendarScreen">
        <div class="hero glass">
          <div class="hero-copy">
            <span class="muted">Этот месяц</span>
            <strong id="monthIncome">0 ₽</strong>
            <span id="monthWorkdays" class="muted">0 рабочих дней</span>
          </div>
          <div class="ring" id="monthRing"><span id="ringValue">0%</span></div>
        </div>

        <div class="calendar glass" id="calendar"></div>

        <div class="legend">
          <span><i class="dot work"></i>Работа</span>
          <span><i class="dot rest"></i>Выходной</span>
          <span><i class="dot pay"></i>Выплата</span>
        </div>
      </section>

      <section class="screen" id="statsScreen">
        <div class="section-title">Статистика</div>
        <div class="stats-grid">
          <div class="glass stat"><span>За месяц</span><b id="statMonth">0 ₽</b></div>
          <div class="glass stat"><span>Рабочих дней</span><b id="statDays">0</b></div>
          <div class="glass stat"><span>Выплат</span><b id="statPays">0</b></div>
          <div class="glass stat"><span>За год</span><b id="statYear">0 ₽</b></div>
        </div>
        <div class="glass chart-card">
          <div class="chart-head"><span>Доход по месяцам</span><span id="yearLabel"></span></div>
          <div class="bars" id="bars"></div>
        </div>
      </section>

      <section class="screen" id="settingsScreen">
        <div class="section-title">Настройки</div>
        <div class="glass settings-card">
          <label>Старт цикла 2/2
            <input id="cycleStart" type="date">
          </label>
          <label>Первый день цикла
            <select id="cycleType">
              <option value="work">Работа</option>
              <option value="rest">Выходной</option>
            </select>
          </label>
          <label>День выплаты №1
            <select id="pay1"><option>1</option><option>5</option><option>10</option><option>15</option></select>
          </label>
          <label>День выплаты №2
            <select id="pay2"><option>15</option><option>20</option><option>25</option><option>30</option></select>
          </label>
          <button class="primary" id="resetBtn">Сбросить отметки</button>
        </div>
        <p class="privacy">Данные хранятся только на этом устройстве. Синхронизации и отправки в интернет нет.</p>
      </section>
    </main>

    <nav class="tabbar glass">
      <button class="tab active" data-screen="calendarScreen"><span>▦</span><small>График</small></button>
      <button class="tab" data-screen="statsScreen"><span>◒</span><small>Статистика</small></button>
      <button class="tab" data-screen="settingsScreen"><span>⌁</span><small>Настройки</small></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
