<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Строгая адаптация, запрет зума -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- PWA теги для iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Клиенты">
  
  <title>Мои Клиенты</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="header-content">
      <h1>Август</h1>
      <p class="subtitle">Выручка: <span id="total-revenue">0</span> ₽</p>
    </div>
  </header>

  <!-- Список клиентов -->
  <main class="content">
    <div id="clients-list" class="clients-list">
      <!-- Карточки будут добавляться сюда -->
    </div>
  </main>

  <!-- Нижняя навигация -->
  <nav class="bottom-nav">
    <div class="nav-item active">
      <div class="icon-placeholder">📊</div>
      <span>Сводка</span>
    </div>
    <div class="nav-item add-btn-container" onclick="toggleModal()">
      <div class="add-btn">+</div>
    </div>
    <div class="nav-item">
      <div class="icon-placeholder">👤</div>
      <span>Профиль</span>
    </div>
  </nav>

  <!-- Модальное окно добавления -->
  <div id="add-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-drag-pill"></div>
      <h2>Новый клиент</h2>
      <input type="text" id="client-name" placeholder="Имя клиента" class="ui-input">
      <input type="text" id="client-service" placeholder="Услуга" class="ui-input">
      <input type="number" id="client-price" placeholder="Сумма (₽)" class="ui-input">
      <button class="ui-button" onclick="addClient()">Добавить</button>
      <button class="ui-button secondary" onclick="toggleModal()">Отмена</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
