<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Юкнига — CRM</title>

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Юкнига">
  <meta name="theme-color" content="#0e091e">

  <!-- Manifest Data URI -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Юкнига CRM","short_name":"Юкнига","start_url":".","display":"standalone","background_color":"#0e091e","theme_color":"#0e091e","icons":[{"src":"https://yoomoney.ru/favicon.ico","sizes":"192x192","type":"image/png"}]}'>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #8b3dff;
      --primary-hover: #7322f2;
      --primary-glow: rgba(139, 61, 255, 0.4);
      --bg-gradient: linear-gradient(135deg, #0e091e 0%, #1c103b 50%, #2b0b46 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --accent-green: #30d158;
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 90px 16px 40px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Фоновые свечения */
    .bg-glow-1, .bg-glow-2 {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
      animation: float 10s ease-in-out infinite alternate;
    }

    .bg-glow-1 {
      width: 320px;
      height: 320px;
      background: rgba(139, 61, 255, 0.25);
      top: -50px;
      left: -50px;
    }

    .bg-glow-2 {
      width: 360px;
      height: 360px;
      background: rgba(255, 107, 107, 0.15);
      bottom: -80px;
      right: -80px;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    /* iPhone Dynamic Island */
    .dynamic-island {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #000000;
      width: 210px;
      height: 36px;
      border-radius: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dynamic-island:hover {
      width: 230px;
      box-shadow: 0 12px 30px rgba(139, 61, 255, 0.3),
                  0 0 0 1px rgba(139, 61, 255, 0.4);
    }

    .island-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .island-logo {
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, #8b3dff, #6310f5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
    }

    .island-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .island-indicator {
      width: 7px;
      height: 7px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    /* Контейнер приложения */
    .app-container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Общие стили карточек */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Форма ввода (Без окон, всё прямо на экране) */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-field, .textarea-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
      user-select: text;
    }

    .textarea-field {
      resize: none;
      height: 80px;
    }

    .input-field::placeholder, .textarea-field::placeholder {
      color: #71717a;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 0 3px rgba(139, 61, 255, 0.2);
    }

    .row-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Фирменная кнопка */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #8b3dff 0%, #6310f5 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 10px 20px var(--primary-glow);
      position: relative;
      overflow: hidden;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shine 4s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      20% { left: 100%; }
      100% { left: 100%; }
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Статистика */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Список клиентов */
    .clients-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .client-item {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      transition: all 0.2s ease;
    }

    .client-item:hover {
      border-color: rgba(139, 61, 255, 0.3);
    }

    .client-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .client-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .client-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-green);
    }

    .client-desc {
      font-size: 14px;
      color: #d1d1d6;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .client-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .btn-delete:active {
      background: rgba(255, 69, 58, 0.15);
    }

    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Поиск */
    .search-box {
      margin-bottom: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding-top: 80px;
      }
      .glass-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Dynamic Island -->
  <div class="dynamic-island">
    <div class="island-brand">
      <div class="island-logo">Ю</div>
      <span class="island-title">Юкнига</span>
    </div>
    <div class="island-indicator"></div>
  </div>

  <div class="app-container">

    <!-- Форма записи -->
    <div class="glass-card">
      <div class="card-title">
        <span>Записать клиента</span>
      </div>
      <form id="addClientForm" class="form-group">
        <input type="text" id="clientName" class="input-field" placeholder="Имя клиента" required autocomplete="off">
        <textarea id="clientDesc" class="textarea-field" placeholder="Описание (услуга, заметки, детали...)" required></textarea>
        
        <div class="row-inputs">
          <input type="number" id="clientPrice" class="input-field" placeholder="Сумма (₽)" required min="0">
          <input type="text" id="clientTime" class="input-field" placeholder="Время / Дата" required>
        </div>

        <button type="submit" class="btn-submit">
          <span>Сохранить запись</span>
        </button>
      </form>
    </div>

    <!-- Статистика -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">Всего записей</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalSum">0 ₽</div>
        <div class="stat-label">Общая сумма</div>
      </div>
    </div>

    <!-- Список клиентов -->
    <div class="glass-card">
      <div class="card-title">
        <span>Записи</span>
      </div>
      
      <div class="search-box">
        <input type="text" id="searchInput" class="input-field" placeholder="Поиск по имени или описанию...">
      </div>

      <div id="clientsList" class="clients-list">
        <!-- Список заполняется через JS -->
      </div>
    </div>

  </div>

  <script>
    // Инициализация хранилища
    let clients = JSON.parse(localStorage.getItem('ukniga_clients')) || [];

    const form = document.getElementById('addClientForm');
    const nameInput = document.getElementById('clientName');
    const descInput = document.getElementById('clientDesc');
    const priceInput = document.getElementById('clientPrice');
    const timeInput = document.getElementById('clientTime');
    const clientsList = document.getElementById('clientsList');
    const searchInput = document.getElementById('searchInput');
    const totalCountEl = document.getElementById('totalCount');
    const totalSumEl = document.getElementById('totalSum');

    // Установка текущего времени по умолчанию
    function setInitialTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      timeInput.value = `${hours}:${minutes}`;
    }
    setInitialTime();

    // Сохранение в LocalStorage
    function saveStorage() {
      localStorage.setItem('ukniga_clients', JSON.stringify(clients));
      render();
    }

    // Добавление записи
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const newClient = {
        id: Date.now(),
        name: nameInput.value.trim(),
        desc: descInput.value.trim(),
        price: parseFloat(priceInput.value) || 0,
        time: timeInput.value.trim(),
        createdAt: new Date().toLocaleDateString('ru-RU')
      };

      clients.unshift(newClient);
      saveStorage();

      // Очистка полей
      nameInput.value = '';
      descInput.value = '';
      priceInput.value = '';
      setInitialTime();
    });

    // Удаление записи
    function deleteClient(id) {
      clients = clients.filter(c => c.id !== id);
      saveStorage();
    }

    // Рендер списка
    function render(query = '') {
      clientsList.innerHTML = '';

      const filtered = clients.filter(c => 
        c.name.toLowerCase().includes(query.toLowerCase()) || 
        c.desc.toLowerCase().includes(query.toLowerCase())
      );

      // Обновление метрик
      totalCountEl.textContent = clients.length;
      const totalSum = clients.reduce((sum, c) => sum + c.price, 0);
      totalSumEl.textContent = `${totalSum.toLocaleString('ru-RU')} ₽`;

      if (filtered.length === 0) {
        clientsList.innerHTML = `<div class="empty-state">${query ? 'Ничего не найдено' : 'Записей пока нет'}</div>`;
        return;
      }

      filtered.forEach(client => {
        const item = document.createElement('div');
        item.className = 'client-item';
        item.innerHTML = `
          <div class="client-header">
            <div class="client-name">${escapeHtml(client.name)}</div>
            <div class="client-price">${client.price.toLocaleString('ru-RU')} ₽</div>
          </div>
          <div class="client-desc">${escapeHtml(client.desc)}</div>
          <div class="client-footer">
            <span>📅 ${escapeHtml(client.time)} (${client.createdAt})</span>
            <button class="btn-delete" onclick="deleteClient(${client.id})">Удалить</button>
          </div>
        `;
        clientsList.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[m]);
    }

    // Поиск
    searchInput.addEventListener('input', (e) => {
      render(e.target.value);
    });

    // Первоначальный рендер
    render();

    // Вшитый Service Worker для оффлайн работы без внешних файлов
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'ukniga-v1';
        self.addEventListener('install', e => {
          self.skipWaiting();
        });
        self.addEventListener('activate', e => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', e => {
          e.respondWith(
            fetch(e.request).catch(() => caches.match(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
