<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Смены">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Смены</title>
  <style>
    :root{
      --bg:#000; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.075);
      --line:rgba(255,255,255,.10); --text:#f5f5f7; --muted:#8e8e93;
      --blue:#667cff; --violet:#8b72ff; --green:#48d597; --red:#ff6472;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
      overscroll-behavior:none}
    body{overflow:hidden}
    button,input{font:inherit}
    button{border:0;color:inherit}
    .app{height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
      display:flex;flex-direction:column;overflow:hidden;
      background:radial-gradient(700px 420px at 90% -10%,rgba(91,91,255,.13),transparent 60%),
                 radial-gradient(600px 400px at -10% 35%,rgba(75,105,255,.07),transparent 60%),#000}
    header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:0 0 auto}
    .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em}.title{font-size:30px;font-weight:750;letter-spacing:-.04em}
    .iconBtn,.primaryBtn{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      box-shadow:0 10px 35px rgba(0,0,0,.3);transition:transform .18s cubic-bezier(.2,.8,.2,1),background .18s}
    .iconBtn:active,.primaryBtn:active,.day:active,.seg:active{transform:scale(.94)}
    .iconBtn{width:42px;height:42px;border-radius:14px;font-size:19px}
    main{min-height:0;flex:1;overflow-y:auto;touch-action:pan-y;padding:0 16px 28px}
    .section{margin-bottom:18px;animation:rise .45s ease both}.section:nth-child(2){animation-delay:.05s}.section:nth-child(3){animation-delay:.1s}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .glass{background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));border:1px solid var(--line);
      border-radius:26px;box-shadow:inset 0 1px rgba(255,255,255,.04),0 20px 60px rgba(0,0,0,.35);
      backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
    .calendar{padding:17px 13px 14px}
    .calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;padding:0 4px}
    .month{font-size:19px;font-weight:700;letter-spacing:-.025em;text-transform:capitalize}
    .nav{display:flex;gap:7px}.nav button{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.06)}
    .week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
    .week div{text-align:center;color:#77777d;font-size:11px;font-weight:650;padding-bottom:5px}
    .day{position:relative;height:53px;border-radius:15px;background:rgba(255,255,255,.025);border:1px solid transparent;
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;transition:transform .16s,background .2s}
    .day.empty{background:transparent}.num{font-size:14px;font-weight:600}.dot{width:5px;height:5px;border-radius:50%;opacity:.9}
    .work{background:linear-gradient(145deg,rgba(102,124,255,.19),rgba(139,114,255,.09));border-color:rgba(125,137,255,.24);box-shadow:0 0 22px rgba(102,124,255,.08)}
    .work .dot{background:#8795ff}.off .dot{background:#555}.sick{background:rgba(255,100,114,.11);border-color:rgba(255,100,114,.18)}.sick .dot{background:var(--red)}
    .today{outline:1px solid rgba(255,255,255,.55);outline-offset:-2px}.pay::after{content:"💰";position:absolute;right:5px;top:3px;font-size:9px}
    .pay{box-shadow:inset 0 0 0 1px rgba(255,190,80,.24),0 0 22px rgba(255,185,60,.07)}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:17px 16px;min-height:118px}.stat.full{grid-column:1/-1;min-height:92px}
    .label{font-size:12px;color:var(--muted);margin-bottom:9px}.value{font-size:25px;font-weight:750;letter-spacing:-.04em}
    .sub{font-size:11px;color:#707078;margin-top:6px}.accent{color:#dfe2ff}
    .setting{padding:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row+.row{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
    .rowTitle{font-size:15px;font-weight:650}.rowSub{font-size:11px;color:var(--muted);margin-top:4px}
    .primaryBtn{padding:11px 14px;border-radius:13px;background:linear-gradient(135deg,rgba(102,124,255,.28),rgba(139,114,255,.18));font-weight:650}
    input[type=date]{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
    .hint{font-size:11px;color:#66666d;text-align:center;margin:10px 5px 0;line-height:1.4}
    .legend{display:flex;gap:13px;justify-content:center;margin-top:13px;color:#77777d;font-size:10px}.legend span{display:flex;align-items:center;gap:5px}
    .lDot{width:6px;height:6px;border-radius:50%}.lw{background:#8795ff}.lo{background:#555}.ls{background:var(--red)}
    .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,15px);opacity:0;
      padding:11px 15px;border-radius:14px;background:rgba(30,30,34,.9);border:1px solid var(--line);backdrop-filter:blur(20px);font-size:12px;pointer-events:none;transition:.25s;z-index:5}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:700px){main{max-width:700px;width:100%;margin:auto}.stats{grid-template-columns:repeat(3,1fr)}.stat.full{grid-column:auto}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="eyebrow">Рабочий трекер</div><div class="title">Смены</div></div>
    <button class="iconBtn" id="todayBtn" aria-label="Сегодня">⌁</button>
  </header>
  <main>
    <section class="section glass calendar">
      <div class="calHead"><div class="month" id="monthTitle"></div><div class="nav">
        <button id="prev">‹</button><button id="next">›</button>
      </div></div>
      <div class="week"><div>ПН</div><div>ВТ</div><div>СР</div><div>ЧТ</div><div>ПТ</div><div>СБ</div><div>ВС</div></div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i class="lDot lw"></i>Рабочий</span><span><i class="lDot lo"></i>Выходной</span><span><i class="lDot ls"></i>Больничный</span></div>
      <div class="hint">Тап по дню: Рабочий → Выходной → Больничный → по кругу</div>
    </section>

    <section class="section stats">
      <div class="stat glass"><div class="label">Заработано в этом месяце</div><div class="value" id="earned">0 ₽</div><div class="sub" id="earnedSub"></div></div>
      <div class="stat glass"><div class="label">Всего за месяц</div><div class="value accent" id="forecast">0 ₽</div><div class="sub" id="forecastSub"></div></div>
      <div class="stat glass full"><div class="label">До следующей зарплаты</div><div class="value" id="payday">—</div><div class="sub" id="paydaySub"></div></div>
    </section>

    <section class="section glass setting">
      <div class="row">
        <div><div class="rowTitle">Первый рабочий день</div><div class="rowSub" id="startText"></div></div>
        <button class="primaryBtn" id="chooseStart">Выбрать</button>
        <input id="startDate" type="date">
      </div>
      <div class="row">
        <div><div class="rowTitle">Ставка</div><div class="rowSub">За одну рабочую смену</div></div>
        <div class="rowTitle">8 300 ₽</div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
