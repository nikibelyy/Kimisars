<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мой CRM">
  <meta name="theme-color" content="#121216">
  <title>Ю-CRM</title>

  <!-- PWA Manifest Dynamic Injection -->
  <script>
    const manifest = {
      "name": "Ю-CRM Клиенты",
      "short_name": "Ю-CRM",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#121216",
      "theme_color": "#7B5CFF",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%237B5CFF'/><text x='50%' y='65%' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>Ю</text></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    :root {
      --bg: #121216;
      --card-bg: #1C1C22;
      --card-hover: #25252E;
      --accent: #7B5CFF;
      --accent-glow: rgba(123, 92, 255, 0.35);
      --mint: #00D692;
      --orange: #FF9500;
      --red: #FF453A;
      --text: #FFFFFF;
      --text-muted: #8E8E93;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    /* Header in YooMoney style */
    header {
      padding: 20px 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFF 0%, #B0B0C0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 12px;
      background: rgba(0, 214, 146, 0.15);
      color: var(--mint);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      background-color: var(--mint);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--mint);
    }

    /* Analytics Balance Cards */
    .stats-container {
      display: flex;
      gap: 12px;
      padding: 10px 20px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stats-container::-webkit-scrollbar {
      display: none;
    }

    .stat-card {
      min-width: 150px;
      flex: 1;
      background: linear-gradient(145deg, var(--card-bg), #18181E);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .stat-card .label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Controls: Search & Tag Filter */
    .controls {
      padding: 0 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .tags-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 5px;
    }

    .filter-chip {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Client List */
    .client-list {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .client-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s ease, background-color 0.2s ease;
      animation: fadeIn 0.3s ease;
    }

    .client-card:active {
      transform: scale(0.98);
      background: var(--card-hover);
    }

    .client-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .client-name {
      font-size: 18px;
      font-weight: 700;
    }

    .client-phone {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .client-revenue {
      font-size: 18px;
      font-weight: 700;
      color: var(--mint);
      text-align: right;
    }

    .auto-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .tag-vip { background: rgba(255, 215, 0, 0.2); color: #FFD700; border: 1px solid rgba(255, 215, 0, 0.3); }
    .tag-new { background: rgba(0, 214, 146, 0.2); color: var(--mint); border: 1px solid rgba(0, 214, 146, 0.3); }
    .tag-attention { background: rgba(255, 69, 58, 0.2); color: var(--red); border: 1px solid rgba(255, 69, 58, 0.3); }
    .tag-regular { background: rgba(123, 92, 255, 0.2); color: var(--accent); border: 1px solid rgba(123, 92, 255, 0.3); }

    .client-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      color: var(--text-muted);
    }

    .action-btn-small {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* Floating Action Button (FAB) */
    .fab {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 25px);
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      background: linear-gradient(135deg, #7B5CFF, #5A35FF);
      color: white;
      border: none;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px var(--accent-glow);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 100;
    }

    .fab:active {
      transform: scale(0.9);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: flex-end;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: 100%;
      background: var(--card-bg);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 24px 20px calc(env(safe-area-inset-bottom) + 24px);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 16px;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 10px;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .submit-btn:active {
      opacity: 0.9;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">Ю-CRM</div>
    <div class="status-badge" id="offlineStatus">Офлайн режим</div>
  </header>

  <!-- Key Metrics -->
  <div class="stats-container">
    <div class="stat-card">
      <div class="label">Клиенты</div>
      <div class="value" id="totalClients">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Доход</div>
      <div class="value" id="totalRevenue" style="color: var(--mint);">0 ₽</div>
    </div>
    <div class="stat-card">
      <div class="label">Внимание</div>
      <div class="value" id="attentionClients" style="color: var(--red);">0</div>
    </div>
  </div>

  <!-- Search & Tag Filters -->
  <div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по имени или телефону...">
    <div class="tags-filter">
      <div class="filter-chip active" data-filter="all">Все</div>
      <div class="filter-chip" data-filter="vip">⭐ VIP</div>
      <div class="filter-chip" data-filter="new">🔥 Новые</div>
      <div class="filter-chip" data-filter="attention">⚠️ Требуют внимания</div>
    </div>
  </div>

  <!-- Dynamic Client Cards -->
  <div class="client-list" id="clientList"></div>

  <!-- Add Client Button -->
  <button class="fab" id="openModalBtn">+</button>

  <!-- Modal Dialog -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Новый клиент</div>
        <button class="close-btn" id="closeModalBtn">✕</button>
      </div>
      <form id="clientForm">
        <input type="hidden" id="clientId">
        <div class="form-group">
          <label>Имя Клиента</label>
          <input type="text" id="clientName" class="form-control" placeholder="Алексей Иванов" required>
        </div>
        <div class="form-group">
          <label>Телефон</label>
          <input type="tel" id="clientPhone" class="form-control" placeholder="+7 (999) 000-00-00">
        </div>
        <div class="form-group">
          <label>Сумма сделок / Доход (₽)</label>
          <input type="number" id="clientRevenue" class="form-control" placeholder="0" value="0">
        </div>
        <div class="form-group">
          <label>Количество визитов</label>
          <input type="number" id="clientVisits" class="form-control" placeholder="1" value="1">
        </div>
        <div class="form-group">
          <label>Заметка / Заказ</label>
          <input type="text" id="clientNote" class="form-control" placeholder="Особенности клиента...">
        </div>
        <button type="submit" class="submit-btn">Сохранить</button>
      </form>
    </div>
  </div>

  <script>
    // --- State & Storage ---
    let clients = JSON.parse(localStorage.getItem('crm_clients')) || [
      {
        id: '1',
        name: 'Анна Сергеева',
        phone: '+7 911 234-56-78',
        revenue: 45000,
        visits: 6,
        note: 'Постоянный клиент, предпочитает вечер',
        createdAt: new Date(Date.now() - 86400000 * 2).toISOString(),
        lastContact: new Date(Date.now() - 86400000 * 5).toISOString()
      },
      {
        id: '2',
        name: 'Дмитрий Волков',
        phone: '+7 905 111-22-33',
        revenue: 8000,
        visits: 1,
        note: 'Интересовался комплексным пакетом',
        createdAt: new Date(Date.now() - 86400000 * 40).toISOString(),
        lastContact: new Date(Date.now() - 86400000 * 35).toISOString()
      }
    ];

    let currentFilter = 'all';

    // --- Save Data ---
    function saveData() {
      localStorage.setItem('crm_clients', JSON.stringify(clients));
      render();
    }

    // --- Auto Tagging Engine ---
    function getAutoTags(client) {
      const tags = [];
      const now = new Date();
      const createdDate = new Date(client.createdAt);
      const lastContactDate = new Date(client.lastContact || client.createdAt);
      
      const daysSinceCreated = (now - createdDate) / (1000 * 60 * 60 * 24);
      const daysSinceContact = (now - lastContactDate) / (1000 * 60 * 60 * 24);

      // VIP rule: Check > 30000 or visits >= 5
      if (client.revenue >= 30000 || client.visits >= 5) {
        tags.push({ label: '⭐ VIP', class: 'tag-vip', key: 'vip' });
      }

      // New rule: Added within last 3 days
      if (daysSinceCreated <= 3) {
        tags.push({ label: '🔥 Новый', class: 'tag-new', key: 'new' });
      }

      // Attention rule: No contact for > 30 days
      if (daysSinceContact > 30) {
        tags.push({ label: '⚠️ Внимание', class: 'tag-attention', key: 'attention' });
      }

      if (tags.length === 0) {
        tags.push({ label: 'Постоянный', class: 'tag-regular', key: 'regular' });
      }

      return tags;
    }

    // --- Render App ---
    function render() {
      const listContainer = document.getElementById('clientList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      listContainer.innerHTML = '';

      let totalRev = 0;
      let attentionCount = 0;

      const filtered = clients.filter(c => {
        const autoTags = getAutoTags(c);
        const matchesSearch = c.name.toLowerCase().includes(searchVal) || c.phone.includes(searchVal);
        
        if (autoTags.some(t => t.key === 'attention')) attentionCount++;
        totalRev += Number(c.revenue || 0);

        if (currentFilter === 'all') return matchesSearch;
        return matchesSearch && autoTags.some(t => t.key === currentFilter);
      });

      // Update Analytics
      document.getElementById('totalClients').innerText = clients.length;
      document.getElementById('totalRevenue').innerText = totalRev.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('attentionClients').innerText = attentionCount;

      // Render Cards
      filtered.forEach(c => {
        const autoTags = getAutoTags(c);
        const card = document.createElement('div');
        card.className = 'client-card';
        
        const tagsHTML = autoTags.map(t => `<span class="tag ${t.class}">${t.label}</span>`).join('');
        
        card.innerHTML = `
          <div class="client-header">
            <div>
              <div class="client-name">${escapeHTML(c.name)}</div>
              <div class="client-phone">${escapeHTML(c.phone || 'Нет телефона')}</div>
            </div>
            <div class="client-revenue">${Number(c.revenue).toLocaleString('ru-RU')} ₽</div>
          </div>
          
          <div class="auto-tags">${tagsHTML}</div>
          
          ${c.note ? `<div style="font-size: 13px; color: #A0A0B0;">${escapeHTML(c.note)}</div>` : ''}

          <div class="client-footer">
            <span>Визитов: ${c.visits || 1}</span>
            <button class="action-btn-small" onclick="touchContact('${c.id}')">Обновить контакт</button>
            <button class="action-btn-small" onclick="editClient('${c.id}')">Изменить</button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // --- Actions ---
    window.touchContact = function(id) {
      const client = clients.find(c => c.id === id);
      if (client) {
        client.lastContact = new Date().toISOString();
        saveData();
      }
    };

    window.editClient = function(id) {
      const c = clients.find(item => item.id === id);
      if (!c) return;
      document.getElementById('clientId').value = c.id;
      document.getElementById('clientName').value = c.name;
      document.getElementById('clientPhone').value = c.phone;
      document.getElementById('clientRevenue').value = c.revenue;
      document.getElementById('clientVisits').value = c.visits || 1;
      document.getElementById('clientNote').value = c.note || '';
      document.getElementById('modalTitle').innerText = 'Редактировать';
      openModal();
    };

    // --- Modal Management ---
    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const clientForm = document.getElementById('clientForm');

    function openModal() { modalOverlay.classList.add('active'); }
    function closeModal() { 
      modalOverlay.classList.remove('active');
      clientForm.reset();
      document.getElementById('clientId').value = '';
      document.getElementById('modalTitle').innerText = 'Новый клиент';
    }

    openModalBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);

    clientForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('clientId').value;
      const name = document.getElementById('clientName').value;
      const phone = document.getElementById('clientPhone').value;
      const revenue = Number(document.getElementById('clientRevenue').value) || 0;
      const visits = Number(document.getElementById('clientVisits').value) || 1;
      const note = document.getElementById('clientNote').value;

      if (id) {
        const c = clients.find(item => item.id === id);
        if (c) {
          c.name = name; c.phone = phone; c.revenue = revenue; c.visits = visits; c.note = note;
        }
      } else {
        clients.unshift({
          id: Date.now().toString(),
          name, phone, revenue, visits, note,
          createdAt: new Date().toISOString(),
          lastContact: new Date().toISOString()
        });
      }

      saveData();
      closeModal();
    });

    // --- Search & Filter Listeners ---
    document.getElementById('searchInput').addEventListener('input', render);

    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        render();
      });
    });

    // --- Service Worker Registration for Offline Capability ---
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'yoo-crm-v1';
        self.addEventListener('install', (e) => {
          e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['./'])));
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // Initial Render
    render();
  </script>
</body>
</html>
