<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7B51FF">
    <title>Моя Зарплата</title>
    
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%D0%9C%D0%BE%D1%8F%20%D0%97%D0%B0%D1%80%D0%BF%D0%BB%D0%B0%D1%82%D0%B0%22%2C%22short_name%22%3A%22%D0%97%D0%B0%D1%80%D0%BF%D0%BB%D0%B0%D1%82%D0%B0%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F5F5F7%22%2C%22theme_color%22%3A%22%237B51FF%22%2C%22icons%22%3A%5B%5D%7D">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F5F7;
            color: #111111;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #F5F5F7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        /* Карточка баланса в стиле ЮMoney */
        .balance-card {
            background: linear-gradient(135deg, #7B51FF 0%, #B83AFC 100%);
            border-radius: 24px;
            padding: 28px 24px;
            color: white;
            box-shadow: 0 12px 24px rgba(123, 81, 255, 0.3);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            animation: slideDown 0.5s ease-out;
        }

        .balance-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(20px);
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .balance-amount {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .currency {
            font-size: 28px;
            opacity: 0.9;
        }

        /* Календарь */
        .calendar-section {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
            animation: fadeIn 0.6s ease-out;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header button {
            background: #F0F0F5;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            color: #111;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-header button:active {
            background: #E0E0E8;
            transform: scale(0.95);
        }

        .month-title {
            font-weight: 600;
            font-size: 18px;
            text-transform: capitalize;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-size: 13px;
            color: #888;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #F8F8FA;
            color: #111;
            border: 2px solid transparent;
        }

        .day.empty {
            background: transparent;
            cursor: default;
        }

        .day:not(.empty):active {
            transform: scale(0.9);
        }

        .day.selected {
            background: #7B51FF;
            color: white;
            box-shadow: 0 4px 12px rgba(123, 81, 255, 0.4);
            transform: scale(1.05);
            border-color: #7B51FF;
        }

        .day.today:not(.selected) {
            border-color: #7B51FF;
            color: #7B51FF;
        }

        /* Табель (Список) */
        .timesheet-section {
            flex-grow: 1;
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            animation: slideUp 0.6s ease-out;
        }

        .timesheet-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .days-count {
            font-size: 14px;
            color: #888;
            font-weight: 400;
        }

        .timesheet-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .timesheet-list::-webkit-scrollbar {
            width: 4px;
        }
        .timesheet-list::-webkit-scrollbar-thumb {
            background: #E0E0E8;
            border-radius: 4px;
        }

        .timesheet-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #F8F8FA;
            border-radius: 16px;
            animation: fadeIn 0.3s ease-out;
        }

        .item-date {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 15px;
        }

        .item-icon {
            width: 32px;
            height: 32px;
            background: rgba(123, 81, 255, 0.1);
            color: #7B51FF;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .item-amount {
            font-weight: 600;
            color: #111;
        }

        .empty-state {
            text-align: center;
            color: #888;
            font-size: 14px;
            padding: 20px 0;
        }

        /* Анимации */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="balance-card" id="balanceCard">
        <div class="balance-label">Заработано за всё время</div>
        <div class="balance-amount">
            <span id="totalSum">0</span>
            <span class="currency">₽</span>
        </div>
    </div>

    <div class="calendar-section">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">&#10094;</button>
            <div class="month-title" id="monthTitle">Сентябрь 2026</div>
            <button onclick="changeMonth(1)">&#10095;</button>
        </div>
        <div class="weekdays">
            <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="days-grid" id="daysGrid">
            </div>
    </div>

    <div class="timesheet-section">
        <div class="timesheet-title">
            Табель
            <span class="days-count" id="daysCount">0 дней</span>
        </div>
        <div class="timesheet-list" id="timesheetList">
            </div>
    </div>

</div>

<script>
    const DAILY_RATE = 8300;
    let currentDate = new Date();
    // Загружаем отработанные дни из LocalStorage
    let workedDays = new Set(JSON.parse(localStorage.getItem('workedDays')) || []);

    const monthsRu = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const monthsRuGenitive = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

    // Инициализация PWA Service Worker (создаем на лету через Blob для одного файла)
    const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => {});
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
    }

    function formatMoney(amount) {
        return amount.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    function toggleDay(dateString) {
        if (workedDays.has(dateString)) {
            workedDays.delete(dateString);
        } else {
            workedDays.add(dateString);
        }
        
        // Анимация карточки баланса при изменении
        const amountEl = document.getElementById('totalSum');
        amountEl.style.transform = 'scale(1.1)';
        setTimeout(() => amountEl.style.transform = 'scale(1)', 150);

        saveAndUpdate();
        renderCalendar(); 
    }

    function saveAndUpdate() {
        localStorage.setItem('workedDays', JSON.stringify([...workedDays]));
        updateStats();
        renderTimesheet();
    }

    function updateStats() {
        const total = workedDays.size * DAILY_RATE;
        document.getElementById('totalSum').innerText = formatMoney(total);
        document.getElementById('daysCount').innerText = `${workedDays.size} дн.`;
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        document.getElementById('monthTitle').innerText = `${monthsRu[month]} ${year}`;
        
        const firstDayIndex = new Date(year, month, 1).getDay() === 0 ? 6 : new Date(year, month, 1).getDay() - 1;
        const lastDay = new Date(year, month + 1, 0).getDate();
        
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        
        const today = new Date();

        // Пустые ячейки до первого дня месяца
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'day empty';
            grid.appendChild(emptyDiv);
        }

        // Дни месяца
        for (let i = 1; i <= lastDay; i++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day';
            dayDiv.innerText = i;
            
            // Формат YYYY-MM-DD для сохранения
            const dateString = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            
            if (workedDays.has(dateString)) {
                dayDiv.classList.add('selected');
            }
            
            if (today.getDate() === i && today.getMonth() === month && today.getFullYear() === year) {
                dayDiv.classList.add('today');
            }

            dayDiv.onclick = () => toggleDay(dateString);
            grid.appendChild(dayDiv);
        }
    }

    function renderTimesheet() {
        const list = document.getElementById('timesheetList');
        list.innerHTML = '';

        if (workedDays.size === 0) {
            list.innerHTML = '<div class="empty-state">Вы пока не отметили рабочие дни</div>';
            return;
        }

        // Сортируем даты по убыванию
        const sortedDays = [...workedDays].sort((a, b) => new Date(b) - new Date(a));

        sortedDays.forEach(dateStr => {
            const [y, m, d] = dateStr.split('-');
            const dateObj = new Date(y, m - 1, d);
            
            const item = document.createElement('div');
            item.className = 'timesheet-item';
            
            item.innerHTML = `
                <div class="item-date">
                    <div class="item-icon">${d}</div>
                    <span>${parseInt(d)} ${monthsRuGenitive[m - 1]} ${y}</span>
                </div>
                <div class="item-amount">+${formatMoney(DAILY_RATE)} ₽</div>
            `;
            list.appendChild(item);
        });
    }

    // Инициализация при загрузке
    renderCalendar();
    saveAndUpdate();

</script>
</body>
</html>
