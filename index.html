<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Записи">
  <meta name="theme-color" content="#121216">
  <title>Записи</title>

  <script>
    const manifest = {
      "name": "Записная Книжка",
      "short_name": "Записи",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#121216",
      "theme_color": "#7B5CFF",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%237B5CFF'/><text x='50%' y='68%' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>Ю</text></svg>",
        "sizes": "192x192 512x512",
        "type": "image/svg+xml"
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>

  <style>
    :root {
      --bg: #121216;
      --card: #1C1C22;
      --card-active: #262630;
      --accent: #7B5CFF;
      --accent-glow: rgba(123, 92, 255, 0.4);
      --mint: #00D692;
      --mint-glow: rgba(0, 214, 146, 0.3);
      --text: #FFFFFF;
      --text-sub: #8E8E93;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-top: calc(env(safe-area-inset-top) + 8px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 100px);
      overflow-x: hidden;
      user-select: none;
    }

    /* Dynamic Island Header */
    .island-header-container {
      display: flex;
      justify-content: center;
      padding: 6px 20px 14px;
    }

    .dynamic-island {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 24px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      animation: islandPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .island-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
    }

    .island-title {
      font-size: 16px;
      font-weight: 700;
      color: #FFF;
      letter-spacing: -0.3px;
    }

    /* Табы переключения */
    .tabs-container {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 4px;
      margin: 0 20px 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #FFF;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Поиск */
    .search-box {
      padding: 0 20px 15px;
    }

    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Список записей */
    .notebook-list {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .note-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s ease;
      animation: slideUp 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .note-card:active {
      transform: scale(0.98);
      background: var(--card-active);
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .note-name {
      font-size: 17px;
      font-weight: 700;
      color: #FFF;
    }

    .note-date {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .income-amount {
      font-size: 18px;
      font-weight: 800;
      color: var(--mint);
    }

    .income-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      border-radius: 14px;
      border-left: 3px solid var(--mint);
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }

    .detail-label {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 600;
      color: #FFF;
      margin-top: 2px;
    }

    .note-body {
      font-size: 15px;
      line-height: 1.4;
      color: #D0D0E0;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      border-radius: 14px;
      border-left: 3px solid var(--accent);
    }

    .note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-action {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-action.delete {
      color: #FF453A;
    }

    /* Нижняя панель с кнопками добавления */
    .floating-bar {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 20px);
      left: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .btn-fab {
      flex: 1;
      padding: 16px;
      border-radius: 20px;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn-fab:active {
      transform: scale(0.95);
    }

    .btn-fab.note {
      background: linear-gradient(135deg, #7B5CFF 0%, #5A35FF 100%);
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .btn-fab.income {
      background: linear-gradient(135deg, #00D692 0%, #00B37A 100%);
      box-shadow: 0 8px 20px var(--mint-glow);
    }

    /* Модалки */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: flex-end;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: 100%;
      background: var(--card);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 24px 20px calc(env(safe-area-inset-bottom) + 24px);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text-sub);
      width: 32px;
      height: 32px;
      border-radius: 16px;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    textarea.form-control {
      min-height: 90px;
      resize: none;
    }

    .submit-btn {
      width: 100%;
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 10px;
    }

    .submit-btn.purple {
      background: var(--accent);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .submit-btn.green {
      background: var(--mint);
      box-shadow: 0 6px 20px var(--mint-glow);
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-sub);
      font-size: 15px;
    }

    @keyframes islandPop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Dynamic Island Header -->
  <div class="island-header-container">
    <div class="dynamic-island">
      <div class="island-dot"></div>
      <div class="island-title">Записи</div>
    </div>
  </div>

  <!-- Переключатель разделов -->
  <div class="tabs-container">
    <button class="tab-btn active" id="tabNotesBtn" onclick="switchTab('notes')">📝 Заметки</button>
    <button class="tab-btn" id="tabIncomeBtn" onclick="switchTab('income')">💰 Доходы</button>
  </div>

  <!-- Поиск -->
  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по записям...">
  </div>

  <!-- Список -->
  <div class="notebook-list" id="notebookList"></div>

  <!-- Нижние кнопки действия -->
  <div class="floating-bar">
    <button class="btn-fab note" onclick="openNoteModal()">✏️ Запись</button>
    <button class="btn-fab income" onclick="openIncomeModal()">💰 Доход</button>
  </div>

  <!-- Модалка обычного текста -->
  <div class="modal-overlay" id="noteModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="noteModalTitle">Новая запись</div>
        <button class="close-btn" onclick="closeNoteModal()">✕</button>
      </div>
      <form id="noteForm">
        <input type="hidden" id="noteId">
        <div class="form-group">
          <label>Тема / Имя</label>
          <input type="text" id="noteName" class="form-control" placeholder="Например: Проект X" required>
        </div>
        <div class="form-group">
          <label>Текст записи</label>
          <textarea id="noteText" class="form-control" placeholder="Подробности..."></textarea>
        </div>
        <button type="submit" class="submit-btn purple">Сохранить запись</button>
      </form>
    </div>
  </div>

  <!-- Модалка дохода (Где, За что, За кого, Сколько) -->
  <div class="modal-overlay" id="incomeModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="incomeModalTitle">Получен доход</div>
        <button class="close-btn" onclick="closeIncomeModal()">✕</button>
      </div>
      <form id="incomeForm">
        <input type="hidden" id="incomeId">
        <div class="form-group">
          <label>Где (Куда пришло / Карта)</label>
          <input type="text" id="incomeWhere" class="form-control" placeholder="Например: Сбербанк / Наличка" required>
        </div>
        <div class="form-group">
          <label>За что (Услуга / Товар)</label>
          <input type="text" id="incomeWhat" class="form-control" placeholder="Например: Разработка сайта" required>
        </div>
        <div class="form-group">
          <label>За кого (Клиент / Заказчик)</label>
          <input type="text" id="incomeWho" class="form-control" placeholder="Например: Антон" required>
        </div>
        <div class="form-group">
          <label>Сколько (Сумма ₽)</label>
          <input type="number" id="incomeAmount" class="form-control" placeholder="0" required>
        </div>
        <button type="submit" class="submit-btn green">Записать доход</button>
      </form>
    </div>
  </div>

  <script>
    let currentTab = 'notes'; // 'notes' или 'income'

    let notes = JSON.parse(localStorage.getItem('my_app_notes')) || [];
    let incomes = JSON.parse(localStorage.getItem('my_app_incomes')) || [];

    function saveAll() {
      localStorage.setItem('my_app_notes', JSON.stringify(notes));
      localStorage.setItem('my_app_incomes', JSON.stringify(incomes));
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabNotesBtn').classList.toggle('active', tab === 'notes');
      document.getElementById('tabIncomeBtn').classList.toggle('active', tab === 'income');
      render();
    }

    function render() {
      const list = document.getElementById('notebookList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      list.innerHTML = '';

      if (currentTab === 'notes') {
        const filtered = notes.filter(item => 
          item.name.toLowerCase().includes(search) || (item.text && item.text.toLowerCase().includes(search))
        );

        if (filtered.length === 0) {
          list.innerHTML = '<div class="empty-state">Заметок пока нет</div>';
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'note-card';
          card.innerHTML = `
            <div class="note-header">
              <div>
                <div class="note-name">${escapeHTML(item.name)}</div>
                <div class="note-date">${item.date}</div>
              </div>
            </div>
            ${item.text ? `<div class="note-body">${escapeHTML(item.text)}</div>` : ''}
            <div class="note-actions">
              <button class="btn-action" onclick="editNote('${item.id}')">Изменить</button>
              <button class="btn-action delete" onclick="deleteNote('${item.id}')">Удалить</button>
            </div>
          `;
          list.appendChild(card);
        });

      } else {
        // Таб Доходы
        const filtered = incomes.filter(item => 
          item.where.toLowerCase().includes(search) || 
          item.what.toLowerCase().includes(search) || 
          item.who.toLowerCase().includes(search)
        );

        if (filtered.length === 0) {
          list.innerHTML = '<div class="empty-state">Записей о доходах пока нет</div>';
          return;
        }

        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'note-card';
          card.innerHTML = `
            <div class="note-header">
              <div>
                <div class="note-name">Закого: ${escapeHTML(item.who)}</div>
                <div class="note-date">${item.date}</div>
              </div>
              <div class="income-amount">+${Number(item.amount).toLocaleString('ru-RU')} ₽</div>
            </div>
            <div class="income-details">
              <div class="detail-item">
                <div class="detail-label">Где</div>
                <div class="detail-value">${escapeHTML(item.where)}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">За что</div>
                <div class="detail-value">${escapeHTML(item.what)}</div>
              </div>
            </div>
            <div class="note-actions">
              <button class="btn-action" onclick="editIncome('${item.id}')">Изменить</button>
              <button class="btn-action delete" onclick="deleteIncome('${item.id}')">Удалить</button>
            </div>
          `;
          list.appendChild(card);
        });
      }
    }

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
    }

    function getNowDate() {
      const now = new Date();
      return now.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' }) + ', ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    // --- Управление Заметками ---
    const noteModalOverlay = document.getElementById('noteModalOverlay');
    function openNoteModal() { noteModalOverlay.classList.add('active'); }
    function closeNoteModal() { 
      noteModalOverlay.classList.remove('active'); 
      document.getElementById('noteForm').reset();
      document.getElementById('noteId').value = '';
    }

    document.getElementById('noteForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('noteId').value;
      const name = document.getElementById('noteName').value;
      const text = document.getElementById('noteText').value;

      if (id) {
        const item = notes.find(x => x.id === id);
        if (item) { item.name = name; item.text = text; }
      } else {
        notes.unshift({ id: Date.now().toString(), name, text, date: getNowDate() });
      }

      saveAll();
      closeNoteModal();
    });

    window.editNote = function(id) {
      const item = notes.find(x => x.id === id);
      if (!item) return;
      document.getElementById('noteId').value = item.id;
      document.getElementById('noteName').value = item.name;
      document.getElementById('noteText').value = item.text || '';
      openNoteModal();
    };

    window.deleteNote = function(id) {
      if (confirm('Удалить эту запись?')) {
        notes = notes.filter(x => x.id !== id);
        saveAll();
      }
    };

    // --- Управление Доходами ---
    const incomeModalOverlay = document.getElementById('incomeModalOverlay');
    function openIncomeModal() { incomeModalOverlay.classList.add('active'); }
    function closeIncomeModal() { 
      incomeModalOverlay.classList.remove('active'); 
      document.getElementById('incomeForm').reset();
      document.getElementById('incomeId').value = '';
    }

    document.getElementById('incomeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('incomeId').value;
      const where = document.getElementById('incomeWhere').value;
      const what = document.getElementById('incomeWhat').value;
      const who = document.getElementById('incomeWho').value;
      const amount = document.getElementById('incomeAmount').value;

      if (id) {
        const item = incomes.find(x => x.id === id);
        if (item) { item.where = where; item.what = what; item.who = who; item.amount = amount; }
      } else {
        incomes.unshift({ id: Date.now().toString(), where, what, who, amount, date: getNowDate() });
      }

      switchTab('income');
      saveAll();
      closeIncomeModal();
    });

    window.editIncome = function(id) {
      const item = incomes.find(x => x.id === id);
      if (!item) return;
      document.getElementById('incomeId').value = item.id;
      document.getElementById('incomeWhere').value = item.where;
      document.getElementById('incomeWhat').value = item.what;
      document.getElementById('incomeWho').value = item.who;
      document.getElementById('incomeAmount').value = item.amount;
      openIncomeModal();
    };

    window.deleteIncome = function(id) {
      if (confirm('Удалить эту запись о доходе?')) {
        incomes = incomes.filter(x => x.id !== id);
        saveAll();
      }
    };

    document.getElementById('searchInput').addEventListener('input', render);

    // Off-line Service Worker
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(caches.open('app-v2').then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }

    render();
  </script>
</body>
</html>
