<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Помощь животным — ЮMoney</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8b3dff;
      --primary-hover: #7322f2;
      --primary-glow: rgba(139, 61, 255, 0.45);
      --bg-gradient: linear-gradient(135deg, #0e091e 0%, #1c103b 50%, #2b0b46 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-main: #1c1c1e;
      --text-muted: #6e6e73;
      --accent-green: #30d158;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
    }

    /* Фоновые свечения */
    .bg-glow-1, .bg-glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      animation: float 8s ease-in-out infinite alternate;
    }

    .bg-glow-1 {
      width: 320px;
      height: 320px;
      background: rgba(139, 61, 255, 0.35);
      top: -40px;
      left: -40px;
    }

    .bg-glow-2 {
      width: 360px;
      height: 360px;
      background: rgba(255, 107, 107, 0.25);
      bottom: -60px;
      right: -60px;
      animation-delay: -4s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    /* Карточка формы */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), 
                  0 0 0 1px rgba(255, 255, 255, 0.15);
      animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Шапка */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 61, 255, 0.1);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      border: 1px solid rgba(139, 61, 255, 0.2);
    }

    .badge-icon {
      font-size: 14px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    .title {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #111;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Быстрый выбор сумм */
    .section-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .preset-btn {
      background: #f2f2f7;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 12px 6px;
      font-size: 16px;
      font-weight: 700;
      color: #2c2c2e;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preset-btn:hover {
      background: #e5e5ea;
      transform: translateY(-2px);
    }

    .preset-btn.active {
      background: #ffffff;
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 4px 14px rgba(139, 61, 255, 0.22);
    }

    .preset-sub {
      font-size: 10px;
      font-weight: 500;
      color: #8e8e93;
      margin-top: 2px;
    }

    .preset-btn.active .preset-sub {
      color: var(--primary);
    }

    /* Поле ввода суммы */
    .input-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .amount-input {
      width: 100%;
      background: #f2f2f7;
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 16px 45px 16px 18px;
      font-size: 22px;
      font-weight: 700;
      color: #1c1c1e;
      outline: none;
      transition: all 0.2s ease;
    }

    .amount-input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(139, 61, 255, 0.15);
    }

    .currency-symbol {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      font-weight: 700;
      color: #8e8e93;
      pointer-events: none;
    }

    /* Фирменная кнопка ЮMoney */
    .yoomoney-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #8b3dff 0%, #6310f5 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      padding: 18px 24px;
      border-radius: 20px;
      text-decoration: none;
      box-shadow: 0 10px 25px var(--primary-glow);
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Анимация перелива кнопки */
    .yoomoney-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.35),
        transparent
      );
      animation: shine 3.5s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      20% { left: 100%; }
      100% { left: 100%; }
    }

    .yoomoney-btn:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 14px 30px rgba(139, 61, 255, 0.55);
    }

    .yoomoney-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .ym-badge {
      width: 28px;
      height: 28px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }

    /* Гарантия безопасности */
    .security-tag {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .shield-icon {
      width: 14px;
      height: 14px;
      fill: var(--accent-green);
    }

    /* Мобильная адаптация */
    @media (max-width: 480px) {
      .card {
        padding: 24px 16px;
        border-radius: 22px;
      }

      .title {
        font-size: 22px;
      }

      .preset-btn {
        padding: 10px 4px;
        font-size: 15px;
      }

      .yoomoney-btn {
        padding: 16px 18px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <div class="card">
      
      <!-- Заголовок -->
      <div class="header">
        <div class="badge">
          <span class="badge-icon">🐾</span> Помощь животным
        </div>
        <h1 class="title">Забота и корм</h1>
        <p class="subtitle">Каждый рубль помогает купить кошачий и собачий корм, медикаменты и тёплые подстилки.</p>
      </div>

      <!-- Выбор суммы -->
      <div class="section-label">Выберите или введите сумму</div>
      <div class="presets-grid">
        <button class="preset-btn" data-value="150">
          150 ₽
          <span class="preset-sub">Порция корма</span>
        </button>
        <button class="preset-btn active" data-value="300">
          300 ₽
          <span class="preset-sub">Обед на 3 дня</span>
        </button>
        <button class="preset-btn" data-value="500">
          500 ₽
          <span class="preset-sub">Вет-осмотр</span>
        </button>
      </div>

      <!-- Поле ввода -->
      <div class="input-wrapper">
        <input type="number" id="customAmount" class="amount-input" value="300" min="1" placeholder="Ваша сумма">
        <span class="currency-symbol">₽</span>
      </div>

      <!-- Красивая кнопка перевода ЮMoney -->
      <a href="https://yoomoney.ru/to/4100119581597465/300" id="payButton" target="_blank" rel="noopener" class="yoomoney-btn">
        <div class="ym-badge">Ю</div>
        <span>Перевести <span id="btnAmount">300</span> ₽</span>
      </a>

      <!-- Безопасность -->
      <div class="security-tag">
        <svg class="shield-icon" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
        </svg>
        Безопасный перевод через ЮMoney
      </div>

    </div>
  </div>

  <script>
    const BASE_URL = 'https://yoomoney.ru/to/4100119581597465';
    const amountInput = document.getElementById('customAmount');
    const payBtn = document.getElementById('payButton');
    const btnAmount = document.getElementById('btnAmount');
    const presetBtns = document.querySelectorAll('.preset-btn');

    function updatePayLink(val) {
      const cleanVal = parseInt(val, 10);
      if (cleanVal && cleanVal > 0) {
        btnAmount.textContent = cleanVal;
        payBtn.href = `${BASE_URL}/${cleanVal}`;
      } else {
        btnAmount.textContent = '0';
        payBtn.href = BASE_URL;
      }
    }

    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const val = btn.getAttribute('data-value');
        amountInput.value = val;
        updatePayLink(val);
      });
    });

    amountInput.addEventListener('input', (e) => {
      const val = e.target.value;
      presetBtns.forEach(b => {
        if (b.getAttribute('data-value') === val) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
      updatePayLink(val);
    });
  </script>

</body>
</html>
