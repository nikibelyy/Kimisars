<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b3ff2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Мой табель</title>
<style>
:root{--p:#7b3ff2;--p2:#a855f7;--bg:#f6f4fb;--card:#fff;--text:#17131f;--muted:#817a8f;--line:#eeeaf4;--green:#21bf84;--red:#e85b70;--shadow:0 14px 40px #38205c14}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#f8f6ff,#f2eff7);color:var(--text);min-height:100vh}
button,input{font:inherit}.app{max-width:540px;margin:auto;min-height:100vh;padding:18px 16px calc(30px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center;font-weight:850;font-size:20px}.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:white;display:grid;place-items:center;font-size:21px;box-shadow:0 8px 22px #7b3ff244}.icon-btn{border:0;background:#fff;width:40px;height:40px;border-radius:14px;box-shadow:var(--shadow);cursor:pointer}
.hero{background:linear-gradient(135deg,#7038ed,#9a4ff2);color:#fff;border-radius:28px;padding:22px;box-shadow:0 18px 45px #743bed3d;animation:up .5s ease}.hero small{opacity:.78}.amount{font-size:42px;font-weight:900;letter-spacing:-1.5px;margin:5px 0}.sub{opacity:.82;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.stat{background:#ffffff1a;border:1px solid #ffffff20;padding:12px;border-radius:17px}.stat b{display:block;font-size:18px;margin-top:3px}
.section{margin-top:22px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section h2{font-size:18px;margin:0}.calendar{background:var(--card);border-radius:25px;padding:15px;box-shadow:var(--shadow)}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.nav{display:flex;gap:6px}.nav button{border:0;background:#f2eff8;border-radius:12px;width:36px;height:36px;font-size:20px;cursor:pointer}.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow div{text-align:center;font-size:11px;color:var(--muted);padding:5px 0}.day{aspect-ratio:1;border:0;background:#faf9fc;border-radius:14px;font-weight:750;color:#514a5b;position:relative;cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s}.day:active{transform:scale(.91)}.day:hover{transform:translateY(-2px)}.day.work{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 7px 16px #7b3ff233}.day.today{outline:2px solid #bba5ef}.day.work:after{content:"✓";position:absolute;right:5px;bottom:3px;font-size:9px;opacity:.9}.empty{visibility:hidden}
.panel{background:#fff;border-radius:23px;padding:17px;box-shadow:var(--shadow);animation:up .25s ease}.selected-date{font-weight:800}.panel-row{display:flex;gap:10px;margin-top:13px}.type-btn{flex:1;border:1px solid var(--line);background:#faf9fc;border-radius:15px;padding:12px 8px;font-size:13px;cursor:pointer}.type-btn.active{border-color:#b99bed;background:#f4efff;color:#6730d7;font-weight:750}.hours{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.hours input{width:90px;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center;outline:none}.hours input:focus{border-color:var(--p)}.panel-actions{display:flex;gap:9px;margin-top:14px}.btn{flex:1;border:0;border-radius:15px;padding:13px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#f1eef7;color:#5e5669}.btn.danger{background:#fff0f2;color:#c43b55}
.settings{display:none;background:#fff;border-radius:23px;padding:17px;box-shadow:var(--shadow);margin-top:14px}.settings.open{display:block;animation:up .25s ease}.field{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.field input{width:125px;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:right;outline:none}.field input:focus{border-color:var(--p)}.share{margin-top:12px;width:100%;border:0;border-radius:15px;padding:13px;background:#f1eef7;color:#5e5669;font-weight:750;cursor:pointer}.note{font-size:12px;color:var(--muted);line-height:1.45;margin:13px 0 0}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:#17131f;color:#fff;padding:12px 17px;border-radius:15px;transition:.3s;z-index:10;box-shadow:0 10px 30px #0002}.toast.show{transform:translate(-50%,0)}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(.96)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
@media(min-width:700px){body{padding:30px}.app{min-height:auto}.hero{padding:28px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">Ю</div><span>Мой табель</span></div>
  <button class="icon-btn" id="settingsBtn" aria-label="Настройки">⚙️</button>
</header>

<section class="hero">
  <small>Заработано в выбранных сменах</small>
  <div class="amount" id="salary">0 ₽</div>
  <div class="sub" id="period">Текущий месяц</div>
  <div class="stats">
    <div class="stat"><small>Смен</small><b id="count">0</b></div>
    <div class="stat"><small>Ставка / день</small><b id="rateLabel">8 300 ₽</b></div>
  </div>
</section>

<section class="section">
  <div class="section-title"><h2>Рабочие дни</h2><span class="muted" id="monthCount"></span></div>
  <div class="calendar">
    <div class="calhead"><b id="month"></b><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div>
    <div class="dow"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>
    <div class="days" id="days"></div>
  </div>
</section>

<section class="section" id="daySection" style="display:none">
  <div class="section-title"><h2>Смена</h2><span class="muted" id="selectedDate"></span></div>
  <div class="panel">
    <div class="panel-row">
      <button class="type-btn active" data-type="work">Работал</button>
      <button class="type-btn" data-type="vacation">Отпуск</button>
      <button class="type-btn" data-type="sick">Больничный</button>
    </div>
    <div class="hours"><span>Часы работы</span><input id="hours" type="number" min="0" max="24" step=".5" value="8"></div>
    <div class="panel-actions"><button class="btn" id="saveDay">Сохранить</button><button class="btn secondary" id="removeDay">Удалить</button></div>
  </div>
</section>

<section class="settings" id="settings">
  <b>Настройки</b>
  <div class="field"><span>Ставка за день</span><input id="rate" type="number" min="0" step="100" value="8300"></div>
  <button class="share" id="share">Поделиться табелем</button>
  <p class="note">Данные сохраняются в браузере. Можно менять ставку и отмечать смены. Отпуск и больничный не добавляются в зарплату.</p>
</section>
</div>
<div class="toast" id="toast">Сохранено</div>

<script>
const KEY='my-timesheet-v2';
let state=JSON.parse(localStorage.getItem(KEY)||'{"rate":8300,"days":{}}');
let view=new Date(); view.setDate(1);
let selected=null, selectedType='work';

const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₽';
const pad=n=>String(n).padStart(2,'0');
const dateKey=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;

function save(){localStorage.setItem(KEY,JSON.stringify(state));updateTotals()}
function updateTotals(){
  const entries=Object.values(state.days);
  const worked=entries.filter(x=>x.type==='work');
  const total=worked.reduce((sum,x)=>sum+(Number(x.pay??state.rate)||0),0);
  $('salary').textContent=money(total); $('count').textContent=worked.length;
  $('rateLabel').textContent=money(state.rate)+'';
  $('rate').value=state.rate;
  const y=view.getFullYear(),m=view.getMonth();
  const monthEntries=Object.keys(state.days).filter(k=>k.startsWith(`${y}-${pad(m+1)}-`)).length;
  $('monthCount').textContent=monthEntries?`${monthEntries} отмечено`:'';
}
function haptic(){if(navigator.vibrate)navigator.vibrate(12)}
function render(){
 const y=view.getFullYear(),m=view.getMonth();
 $('month').textContent=new Date(y,m,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 $('month').textContent=$('month').textContent[0].toUpperCase()+$('month').textContent.slice(1);
 $('period').textContent=new Date(y,m,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
 const first=new Date(y,m,1), last=new Date(y,m+1,0), start=(first.getDay()+6)%7;
 $('days').innerHTML='';
 for(let i=0;i<start;i++){let e=document.createElement('button');e.className='day empty';$('days').append(e)}
 const today=new Date();
 for(let d=1;d<=last.getDate();d++){
   const e=document.createElement('button'),k=dateKey(y,m,d), item=state.days[k];
   e.className='day';e.textContent=d;
   if(item?.type==='work')e.classList.add('work');
   if(y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate())e.classList.add('today');
   e.onclick=()=>openDay(k);
   $('days').append(e);
 }
 updateTotals();
}
function openDay(k){
 selected=k; const item=state.days[k];
 selectedType=item?.type||'work';
 const [y,m,d]=k.split('-').map(Number);
 $('selectedDate').textContent=new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
 $('hours').value=item?.hours??8;
 document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===selectedType));
 $('daySection').style.display='block'; $('daySection').classList.remove('pop'); void $('daySection').offsetWidth; $('daySection').classList.add('pop');
}
document.querySelectorAll('.type-btn').forEach(b=>b.onclick=()=>{selectedType=b.dataset.type;document.querySelectorAll('.type-btn').forEach(x=>x.classList.toggle('active',x===b))});
$('saveDay').onclick=()=>{
 if(!selected)return;
 const hours=Math.max(0,Number($('hours').value)||0);
 state.days[selected]={type:selectedType,hours,pay:selectedType==='work'?state.rate:0};
 save();render();haptic();toast(selectedType==='work'?'Рабочий день сохранён':'Отметка сохранена');
};
$('removeDay').onclick=()=>{if(selected){delete state.days[selected];save();render();$('daySection').style.display='none';haptic();toast('День удалён')}};
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$('settingsBtn').onclick=()=>$('settings').classList.toggle('open');
$('rate').onchange=()=>{
 state.rate=Math.max(0,Number($('rate').value)||0);
 Object.values(state.days).forEach(x=>{if(x.type==='work')x.pay=state.rate});
 save();render();toast('Ставка обновлена');
};
$('share').onclick=async()=>{
 const entries=Object.values(state.days),worked=entries.filter(x=>x.type==='work');
 const text=`Мой табель\nРабочих дней: ${worked.length}\nЗаработано: ${money(worked.reduce((a,x)=>a+(Number(x.pay)||0),0))}\nСтавка: ${money(state.rate)} / день`;
 try{if(navigator.share)await navigator.share({title:'Мой табель',text});else{await navigator.clipboard.writeText(text);toast('Скопировано')}}catch(e){}
};
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
</body></html>
