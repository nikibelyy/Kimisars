<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Проверка полиса</title>
  
  <!-- Настройки для iPhone PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="НСИС Чек">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://img.icons8.com/isometric-folders/512/shield.png">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Шапка -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🛡️</span>
        <span class="logo-text">Проверка полиса</span>
      </div>
    </header>

    <!-- Главная карточка (Стиль ЮMoney) -->
    <main class="content">
      <div class="card">
        <h2 class="card-title">Введите данные</h2>
        <p class="card-subtitle">Для проверки полиса ОСАГО / ДСАГО в базе НСИС</p>

        <form id="checkForm" onsubmit="handleSubmit(event)">
          <!-- Поле 1: Буквы (Серия) -->
          <div class="input-group">
            <label for="serial">Серия полиса (буквы)</label>

            <div class="input-wrapper">
              <input 
                type="text" 
                id="serial" 
                placeholder="например, ХХХ" 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="characters" 
                required
              >
            </div>
          </div>

          <!-- Поле 2: Цифры (Номер) -->
          <div class="input-group">
            <label for="number">Номер полиса (цифры)</label>
            <div class="input-wrapper">
              <input 
                type="tel" 
                id="number" 
                pattern="[0-9]*" 
                inputmode="numeric" 
                placeholder="например, 0669291219" 
                autocomplete="off" 
                required
              >
            </div>
          </div>

          <!-- Кнопка действия -->
          <button type="submit" class="btn-primary" id="submitBtn">
            <span>Проверить полис</span>
            <div class="spinner hidden" id="spinner"></div>
          </button>
        </form>
      </div>
    </main>

    <!-- Модальный экран с результатом (iOS Sheet style) -->
    <div class="modal-overlay hidden" id="modalOverlay" onclick="closeModal()">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="modal-header">
          <h3>Результат запроса</h3>
          <button class="btn-close" onclick="closeModal()">✕</button>
        </div>
        
        <div class="modal-body">
          <p class="info-text">Ссылка сформирована. Нажмите кнопку ниже для перехода на официальный сайт НСИС:</p>
          
          <div class="link-preview-box">
            <span class="link-label">Сформированный URL:</span>
            <div class="link-url" id="generatedUrl">---</div>
          </div>

          <a id="redirectBtn" href="#" target="_blank" class="btn-secondary">
            Перейти на сайт НСИС ↗
          </a>
          
          <button type="button" class="btn-tertiary" onclick="copyLink()">
            Скопировать ссылку
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
